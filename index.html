<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maulana | Creative Portfolio</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset Dasar */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Styling Body */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050509; /* Warna background gelap solid */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Mencegah scrollbar saat animasi particle aktif */
        }

        /* Canvas untuk Background Particle */
        #particle-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; /* Di belakang konten */
            opacity: 0.6;
        }

        /* Styling Kartu Utama */
        .card {
            background: rgba(255, 255, 255, 0.03); /* Sedikit lebih transparan */
            padding: 50px;
            border-radius: 25px;
            backdrop-filter: blur(20px); /* Efek kaca buram lebih kuat */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2; /* Di depan particle */
            animation: slideInUp 0.8s ease-out; /* Animasi masuk */
            max-width: 500px;
            width: 90%;
        }

        /* Animasi Kartu Masuk */
        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Judul Utama dengan Gradien */
        h1 {
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        /* Emoji Roket */
        .rocket {
            display: inline-block;
            animation: launch 2s infinite;
            margin-left: 5px;
        }

        @keyframes launch {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        /* Paragraf Deskripsi */
        p {
            color: #c8c8c8;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Tombol Interaktif */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        /* Efek Hover Tombol */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(35deg);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .btn:hover::after {
            left: 120%;
        }

    </style>
</head>
<body>

    <!-- Canvas untuk Efek Partikel -->
    <canvas id="particle-canvas"></canvas>

    <!-- Kartu Konten Utama -->
    <div class="card">
        <h1>Halo, Maulana <span class="rocket">🚀</span></h1>
        <p>Selamat datang di versi terbaru portofoliomu. Halaman ini kini tampil lebih dinamis dan modern.</p>
        <a href="mailto:maulana@email.com" class="btn">Hubungi Saya</a>
    </div>

    <!-- Script untuk Background Particle -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // Mengatur ukuran canvas agar selalu penuh layar
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Kelas Partikel
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8; // Kecepatan horizontal
                this.vy = (Math.random() - 0.5) * 0.8; // Kecepatan vertikal
                this.radius = Math.random() * 1.5; // Ukuran partikel acak
                this.color = '#ffffff'; // Warna putih
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Memantulkan partikel saat menyentuh tepi layar
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Inisialisasi partikel
        function initParticles() {
            particles = [];
            const numberOfParticles = (canvas.width * canvas.height) / 10000; // Kepadatan partikel
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        // Animasi loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>

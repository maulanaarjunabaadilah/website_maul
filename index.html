<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website maulana</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin-bottom: 10px; color: #00d2ff; }
        p { color: #b3b3b3; }
        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #00d2ff;
            color: #1e1e2f;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo, Dunia! 🚀</h1>
        <p>Website ini berhasil online berkat kerja keras saya sendiri.</p>
        <a href="#" class="badge">Selamat Datang</a>
    </div>
</body>
</html>
